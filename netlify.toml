[build]
  command = "node build.mjs"
  publish = "dist"

[[redirects]]
  from = "/p/:slug"
  to = "/coupon.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    X-Frame-Options = "DENY"
    Content-Security-Policy = "default-src 'none'; script-src 'self'; style-src 'self'; img-src https://kgtmsuluifdtdxddiamg.supabase.co; connect-src https://kgtmsuluifdtdxddiamg.supabase.co; base-uri 'none'; form-action 'none'; frame-ancestors 'none'"

[[headers]]
  for = "/p/*"
  [headers.values]
    Cache-Control = "no-store"
    X-Robots-Tag = "noindex, nofollow"
